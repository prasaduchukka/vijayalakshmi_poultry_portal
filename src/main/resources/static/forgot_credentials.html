<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Recovery – Vijayalakshmi Poultry Farm</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .recovery-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#f8f3e8,#e9f1e7)}
    .recovery-card{width:min(100%,520px);background:#fff;border:1px solid #e5e0d5;border-radius:18px;padding:clamp(22px,5vw,36px);box-shadow:0 18px 55px rgba(35,55,36,.12)}
    .recovery-brand{text-align:center;margin-bottom:24px}.recovery-brand img{width:76px;height:76px;object-fit:cover;border-radius:50%;margin-bottom:10px}
    .recovery-step{border-top:1px solid #eee8dd;padding-top:18px;margin-top:18px}.recovery-step[hidden]{display:none!important}
    .recovery-note{font-size:13px;color:#6b7280;line-height:1.5;margin:8px 0 14px}.recovery-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.recovery-actions .btn-primary{flex:1}
  </style>
</head>
<body>
  <main class="recovery-wrap">
    <section class="recovery-card">
      <header class="recovery-brand">
        <img src="assets/vijayalakshmi-poultry-logo.png" alt="Vijayalakshmi Poultry Farm logo">
        <div class="eyebrow">Secure account access</div>
        <h1 style="margin:6px 0">Account Recovery</h1>
        <p class="recovery-note">Verify your registered recovery email, then set both a new username and a new password.</p>
      </header>
      <div id="recovery-message" aria-live="polite"></div>
      <form id="request-form">
        <div class="field">
          <label for="recovery-email">Registered recovery email</label>
          <input type="email" id="recovery-email" required autocomplete="email" placeholder="Enter your registered email">
        </div>
        <button type="submit" class="btn-primary" id="send-otp-btn">Send OTP</button>
      </form>
      <form id="verify-form" class="recovery-step" hidden>
        <div class="field">
          <label for="recovery-otp">6-digit email OTP</label>
          <input type="text" id="recovery-otp" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="Enter the code from your email">
        </div>
        <button type="submit" class="btn-primary" id="verify-otp-btn">Verify OTP</button>
        <p class="recovery-note">The code expires in 5 minutes. Check your spam folder if it does not appear.</p>
      </form>
      <form id="credentials-form" class="recovery-step" hidden>
        <div class="field">
          <label for="new-username">New username</label>
          <input type="text" id="new-username" required minlength="3" maxlength="60" autocomplete="username" placeholder="Choose a new username">
        </div>
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" required minlength="10" maxlength="72" autocomplete="new-password" placeholder="At least 10 characters">
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" required minlength="10" maxlength="72" autocomplete="new-password" placeholder="Re-enter new password">
        </div>
        <button type="submit" class="btn-primary" id="save-credentials-btn">Update Username and Password</button>
      </form>
      <p style="text-align:center;margin:22px 0 0"><a href="index.html">← Back to login</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/format.js"></script>
  <script>
    const messageBox = document.getElementById('recovery-message');
    const requestForm = document.getElementById('request-form');
    const verifyForm = document.getElementById('verify-form');
    const credentialsForm = document.getElementById('credentials-form');
    let resetToken = null;
    const emailValue = () => document.getElementById('recovery-email').value.trim();
    const showMessage = (kind, message) => {
      const safe = typeof escapeHtml === 'function' ? escapeHtml(message) : message;
      messageBox.innerHTML = `<div class="alert alert-${kind}">${safe}</div>`;
    };

    requestForm.addEventListener('submit', async (event) => {
      event.preventDefault(); messageBox.innerHTML = '';
      const button = document.getElementById('send-otp-btn'); button.disabled = true; button.textContent = 'Sending OTP...';
      try {
        await Api.post('/api/auth/recovery/request-otp', { email: emailValue(), purpose: 'ACCOUNT' });
        verifyForm.hidden = false;
        showMessage('success', 'If this email is registered, an OTP will be sent. Check your inbox and spam folder.');
      } catch (error) { showMessage('error', error.message); }
      finally { button.disabled = false; button.textContent = 'Send OTP'; }
    });

    verifyForm.addEventListener('submit', async (event) => {
      event.preventDefault(); messageBox.innerHTML = '';
      const button = document.getElementById('verify-otp-btn'); button.disabled = true; button.textContent = 'Verifying...';
      try {
        const result = await Api.post('/api/auth/recovery/verify-otp', {
          email: emailValue(), purpose: 'ACCOUNT', otp: document.getElementById('recovery-otp').value.trim()
        });
        resetToken = result.resetToken;
        credentialsForm.hidden = false;
        verifyForm.hidden = true;
        requestForm.querySelector('input').readOnly = true;
        showMessage('success', 'Email verified. Enter your new username and password below.');
      } catch (error) { showMessage('error', error.message); }
      finally { button.disabled = false; button.textContent = 'Verify OTP'; }
    });

    credentialsForm.addEventListener('submit', async (event) => {
      event.preventDefault(); messageBox.innerHTML = '';
      const username = document.getElementById('new-username').value.trim();
      const password = document.getElementById('new-password').value;
      if (password !== document.getElementById('confirm-password').value) {
        showMessage('error', 'The passwords do not match.'); return;
      }
      const button = document.getElementById('save-credentials-btn'); button.disabled = true; button.textContent = 'Updating credentials...';
      try {
        const result = await Api.post('/api/auth/recovery/reset-credentials', {
          email: emailValue(), resetToken, newUsername: username, newPassword: password
        });
        showMessage('success', result.message || 'Credentials updated. Please log in.');
        credentialsForm.hidden = true; requestForm.hidden = true; verifyForm.hidden = true;
        setTimeout(() => { window.location.href = 'index.html'; }, 2200);
      } catch (error) { showMessage('error', error.message); }
      finally { button.disabled = false; button.textContent = 'Update Username and Password'; }
    });
  </script>
</body>
</html>
