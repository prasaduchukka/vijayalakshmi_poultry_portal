
server:
  port: ${PORT:8088}
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:Lax}

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
      idle-timeout: 180000
      max-lifetime: 270000
      keepalive-time: 120000
      connection-timeout: 20000
      validation-timeout: 5000
      data-source-properties:
        tcpKeepAlive: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  jackson:
    time-zone: Asia/Kolkata

  # Email OTP configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  default-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://vijayalakshmipoultryportal-production.up.railway.app,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8088}
    
# Brevo HTTPS email API (works on Railway plans where outbound SMTP is restricted).
brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:}
  sender-name: ${BREVO_SENDER_NAME:Vijayalakshmi Poultry Farm}
