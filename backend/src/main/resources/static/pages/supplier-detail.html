<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Purchases – Vijayalakshmi Poultry Farm</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="purchases" data-title="Supplier Purchases">
  <div id="page-content">
    <div class="card" id="supplier-header-card">
      <div class="loading-row">Loading supplier...</div>
    </div>

    <div class="card">
      <div class="toolbar" style="margin-bottom: 0;">
        <div class="card-title-row" style="margin:0;"><h2>Purchase History</h2></div>
        <div class="filters">
          <label style="margin:0;">From</label>
          <input type="date" id="rp-from">
          <label style="margin:0;">To</label>
          <input type="date" id="rp-to">
          <button class="btn-outline btn-sm" id="generate-pdf-btn">🖶️ Generate Purchase PDF</button>
        </div>
      </div>
      <table>
        <thead><tr><th>Date</th><th>Vehicle No</th><th>Birds</th><th>Boxes</th><th>Weight</th><th>Driver</th><th>Helper</th></tr></thead>
        <tbody id="purchases-body"><tr><td colspan="7" class="table-empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/supplier-detail.js"></script>
</body>
</html>
