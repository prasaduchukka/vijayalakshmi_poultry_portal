server:
  port: ${PORT:8088}
  servlet:
    session:
      cookie:
        # On Render (HTTPS), set COOKIE_SECURE=true via environment variables.
        # Leave both at their defaults for local HTTP development.
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:Lax}

spring:
  datasource:
    url: jdbc:postgresql://dpg-dblllq59fdbs73c38r2g-a.oregon-postgres.render.com:5432/rainbow_42ax
    username: ${DB_USERNAME:rainbow_42ax_user}
    password: ${DB_PASSWORD:xGih9tb4yrwW45A6Qa5xDL53eoytWElF}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
      # A remote Postgres (or a router/firewall in between the app and it) can
      # silently drop an idle connection well before HikariCP's own defaults
      # (30 min max-lifetime, 10 min idle-timeout) would ever recycle it. The
      # pool then hands out a connection that LOOKS fine but is actually dead,
      # and the next query blocks for the full connection-timeout before
      # failing - this is exactly the
      #   "HikariPool-1 - Failed to validate connection ... This connection
      #    has been closed"
      #   "Connection is not available, request timed out after 30010ms"
      #   "SSL error: Read timed out"
      # pattern seen after a few idle minutes. Recycling connections
      # proactively, well inside that window, and pinging idle ones in the
      # meantime, means a stale connection is never handed out in the first place.
      idle-timeout: 180000        # 3 minutes
      max-lifetime: 270000        # 4.5 minutes
      keepalive-time: 120000      # 2 minutes - pings idle pooled connections so they never sit long enough to be silently dropped
      connection-timeout: 20000   # 20s - fail fast instead of blocking a request for 30s on an already-dead connection
      validation-timeout: 5000
      data-source-properties:
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
  jackson:
    time-zone: Asia/Kolkata

# Default admin account created automatically on first run if no users exist.
# CHANGE THE PASSWORD after first login (Admin > Change Password), or set env vars below.
app:
  default-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8088}

