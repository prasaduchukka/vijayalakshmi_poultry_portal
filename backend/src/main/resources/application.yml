server:
  port: ${PORT:8088}
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:Lax}

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
      # Railway's TCP proxy / home routers silently drop idle sockets after a
      # couple of minutes. Ping idle connections every 30s and retire them
      # well before that happens, so a dead socket is never handed to a request.
      idle-timeout: 120000
      max-lifetime: 240000
      keepalive-time: 30000
      connection-timeout: 20000
      validation-timeout: 5000
      data-source-properties:
        tcpKeepAlive: true
        connectTimeout: 15
        socketTimeout: 60
        loginTimeout: 20

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  jackson:
    time-zone: Asia/Kolkata

app:
  default-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

  cors:
    allowed-origins: "${ALLOWED_ORIGINS:https://www.vijayalakshmipoultryfarm.in,https://vijayalakshmipoultryportal-production.up.railway.app/,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8088}"

  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:Vijayalakshmi Poultry Farm}
